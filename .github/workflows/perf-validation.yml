name: Performance branch validation

on:
  push:
    branches: [ "perf-optimization-20260924" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile backend
        run: mvn -B -DskipTests package
      - name: Bounded production read load test
        env:
          PARFUM_API_BASE: https://parfum-backend-jvcw.onrender.com/api
          LOAD_ROUNDS: "3"
        run: python3 performance/http_load_test.py
