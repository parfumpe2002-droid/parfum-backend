name: Push notification validation

on:
  push:
    branches: [ "master" ]
    paths:
      - "src/main/java/com/parfum/dto/CommerceDtos.java"
      - "src/main/java/com/parfum/jpa/entity/Pedido.java"
      - "src/main/java/com/parfum/service/PedidoService.java"
      - ".github/workflows/push-validation.yml"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and test backend
        run: mvn -B test
