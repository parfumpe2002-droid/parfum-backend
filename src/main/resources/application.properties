spring.application.name=parfum-backend
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Neon PostgreSQL. En local usa PostgreSQL instalado.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parfum}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# MongoDB Atlas. En local usa MongoDB instalado.
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/parfum}
spring.data.mongodb.auto-index-creation=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Aplicación
app.cors-origins=${CORS_ORIGINS:https://parfum-store-app.netlify.app,https://*.netlify.app,http://localhost:8383,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}
app.token-days=${APP_TOKEN_DAYS:30}
app.seed-data=${APP_SEED_DATA:true}
app.admin-email=${APP_ADMIN_EMAIL:}
app.admin-password=${APP_ADMIN_PASSWORD:}
app.admin-name=${APP_ADMIN_NAME:Administrador Parfum}

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.error.include-message=always
